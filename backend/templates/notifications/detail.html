{% extends 'base.html' %}
{% block title %}{{ notification.title }}{% endblock %}
{% block page_title %}Notification Detail{% endblock %}
{% block content %}
<div class="w-full">
  <div class="flex flex-wrap -mx-4">
    <div class="w-full md:w-2/3 px-4">
      <div class="card">
        <div
          class="px-6 py-4 border-b border-borderColor bg-black/20 flex justify-between items-center"
        >
          <h5>{{ notification.title }}</h5>
          <a
            href="{% url 'notifications:list' %}"
            class="inline-block px-4 py-2 rounded font-medium transition-colors text-center cursor-pointer text-sm px-3 py-1 bg-[#333] text-white hover:bg-[#444] border border-borderColor"
            >Back to Notifications</a
          >
        </div>
        <div class="p-6">
          <p class="text-gray-400">
            <small>{{ notification.created_at|date:"F d, Y H:i" }}</small>
          </p>
          <div class="notification-content">{{ notification.message }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
