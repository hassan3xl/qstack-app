{% extends 'base.html' %}
{% block title %}Edit Staff Profile{% endblock %}
{% block page_title %}Edit Staff Profile{% endblock %}

{% block content %}
<div class="w-full">
  <div class="flex flex-wrap -mx-4">
    <div class="w-full md:w-2/3 px-4">
      <div class="card">
        <div class="px-6 py-4 border-b border-borderColor bg-black/20">
          <h5>Edit Staff Profile</h5>
        </div>
        <div class="p-6">
          <form
            method="post"
            enctype="multipart/form-data"
            class=""
            novalidate
          >
            {% csrf_token %}
            <div class="mb-3">
              <label for="avatar" class="block text-sm font-medium mb-1 text-gray-300">Avatar</label>
              {% if staff_profile.avatar %}
              <div class="mb-2">
                <img
                  src="{{ staff_profile.avatar.url }}"
                  alt="Current Avatar"
                  width="100"
                  class="rounded"
                />
              </div>
              {% endif %}
              <input
                type="file"
                class="form-control"
                id="avatar"
                name="avatar"
                accept="image/*"
              />
              <small class="form-text text-gray-400"
                >Leave blank to keep current avatar</small
              >
            </div>
            <div class="mb-3">
              <label for="bio" class="block text-sm font-medium mb-1 text-gray-300">Bio</label>
              <textarea class="form-control" id="bio" name="bio" rows="4">
{{ staff_profile.bio|default:'' }}</textarea
              >
            </div>
            <div class="mb-3">
              <label for="role" class="block text-sm font-medium mb-1 text-gray-300">Role</label>
              <select class="form-control" id="role" name="role">
                <option value="">-- Select Role --</option>
                {% for role in roles %}
                <option
                  value="{{ role.id }}"
                  {% if staff_profile.role.id == role.id %}selected{% endif %}
                >
                  {{ role.name }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="grid gap-2 d-md-flex md:justify-start">
              <button type="submit" class="inline-block px-4 py-2 rounded font-medium transition-colors text-center cursor-pointer btn-primary">
                Save Changes
              </button>
              <a
                href="{% url 'users:staff_profile' %}"
                class="inline-block px-4 py-2 rounded font-medium transition-colors text-center cursor-pointer bg-[#333] text-white hover:bg-[#444] border border-borderColor"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
